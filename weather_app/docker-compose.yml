version: "3.9"
 
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: weatherdb
      POSTGRES_USER: weatheruser
      POSTGRES_PASSWORD: weatherpass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatheruser -d weatherdb"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://weatheruser:weatherpass@db:5432/weatherdb
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
 
  ingestion:
    build: ./ingestion
    environment:
      DATABASE_URL: postgresql://weatheruser:weatherpass@db:5432/weatherdb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ingestion:/app
 
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
 
volumes:
  pgdata:
 